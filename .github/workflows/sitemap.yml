name: Gerar sitemap.xml

on:
  # Publicou HTML neste repositório: atualiza na hora
  push:
    branches: [main]
    paths:
      - '**.html'

  # Publicou em qualquer outro repositório seu: a varredura diária pega
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 03:00 em Brasília

  # Botão manual na aba Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descobrir páginas e montar sitemap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gerar_sitemap.py

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap já estava atualizado. Nada a fazer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: atualiza sitemap.xml"
          git push
