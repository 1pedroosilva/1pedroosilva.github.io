name: Gerar sitemap.xml

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o lastmod vem do git log

      - name: Montar sitemap
        run: python3 .github/scripts/gerar_sitemap.py

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap já estava atualizado. Nada a fazer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: atualiza sitemap.xml"
          git push
